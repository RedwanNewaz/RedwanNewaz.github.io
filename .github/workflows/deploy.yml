name: Build and deploy to GitHub Pages

# Builds the React app and publishes the contents of build/ to the gh-pages
# branch. In the repository, set Settings -> Pages -> Source to
# "Deploy from a branch" -> gh-pages / (root).

on:
  push:
    branches:
      - main
      - master
      - redwan
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Treat warnings as warnings, not build failures.
          CI: false

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
