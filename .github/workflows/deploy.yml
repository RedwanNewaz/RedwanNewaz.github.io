name: Build and deploy to GitHub Pages

# Builds the React app and publishes build/ directly to GitHub Pages.
#
# REQUIRED ONE-TIME SETTING:
#   Repository -> Settings -> Pages -> Build and deployment -> Source
#   must be set to "GitHub Actions".
#
# If Source is left on "Deploy from a branch" pointing at the source branch,
# GitHub serves the repository files instead of the build, and visitors see
# the README rendered as the home page.

on:
  push:
    branches:
      - main
      - master
      - redwan
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false # treat lint warnings as warnings, not build failures

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the build output as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
